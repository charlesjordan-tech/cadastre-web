<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte - Cadastre Diaspora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; }

    header { background: #ffffff; border-bottom: 1px solid #e2e8f0; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
    .logo { font-weight: 700; font-size: 1.15rem; color: #0f172a; text-decoration: none; }
    .logo span { color: #0284c7; }
    nav { display: flex; align-items: center; gap: 1.5rem; }
    nav a { text-decoration: none; color: #475569; font-weight: 500; font-size: 0.9rem; }
    nav a:hover { color: #0284c7; }

    .signup-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
    .signup-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; width: 100%; max-width: 560px; padding: 2.5rem 2rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }

    .signup-header { text-align: center; margin-bottom: 2rem; }
    .signup-header h1 { font-size: 1.5rem; color: #0f172a; margin-bottom: 0.5rem; }
    .signup-header p { font-size: 0.875rem; color: #64748b; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #334155; }
    .form-group input, .form-group select { width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; background-color: #fff; }
    .form-group input:focus, .form-group select:focus { border-color: #0284c7; }

    .terms-option { display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.825rem; margin-bottom: 1.5rem; color: #475569; line-height: 1.4; }
    .terms-option input { margin-top: 0.2rem; }
    .terms-option a { color: #0284c7; text-decoration: none; font-weight: 500; }
    .terms-option a:hover { text-decoration: underline; }

    .btn-submit { background-color: #ea580c; color: white; border: none; padding: 0.85rem; border-radius: 6px; font-weight: 600; font-size: 0.95rem; width: 100%; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background-color: #c2410c; }

    .login-link { text-align: center; font-size: 0.875rem; color: #475569; margin-top: 1.5rem; }
    .login-link a { color: #0284c7; font-weight: 600; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }

    .phone-container { display: flex; gap: 0.5rem; position: relative; }
    .country-select { position: relative; }
    .selected-country-btn {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.75rem 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px;
      background: #ffffff; cursor: pointer; font-size: 0.9rem; font-weight: 500;
      color: #334155; height: 100%; white-space: nowrap;
    }
    .selected-country-btn:hover { border-color: #0284c7; }
    .arrow-icon { font-size: 0.65rem; color: #64748b; margin-left: 0.2rem; }

    .country-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); left: 0;
      width: 250px; max-height: 220px; overflow-y: auto;
      background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); z-index: 100;
    }
    .country-dropdown.show { display: block; }
    .country-option {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.65rem 0.8rem; cursor: pointer; font-size: 0.875rem; color: #1e293b;
    }
    .country-option:hover { background-color: #f1f5f9; }
    .country-option .code { color: #64748b; font-weight: 500; }
    .phone-container input[type="tel"] { flex: 1; }
    .selected-country-btn img, .country-info img { width: 20px; height: auto; border-radius: 2px; }
    .country-info { display: flex; align-items: center; gap: 0.5rem; }

    .success-msg { background: #f0fdf4; color: #15803d; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .error-msg { background: #fef2f2; color: #b91c1c; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
      .signup-card { padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">📍 CADASTRE <span>DIASPORA</span></a>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="page assistance.html">Assistance</a>
      </nav>
    </div>
  </header>

  <main class="signup-wrapper">
    <div class="signup-card">
      <div class="signup-header">
        <h1>Créer votre compte</h1>
        <p>Accédez à la gestion et au suivi de vos biens fonciers</p>
      </div>

      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>

      <form id="signupForm">
        
        <div class="form-row">
          <div class="form-group">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" placeholder="Ex: Jean" required>
          </div>
          <div class="form-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" placeholder="Ex: Dupont" required>
          </div>
        </div>

        <div class="form-group">
          <label for="profile-type">Type de compte</label>
          <select id="profile-type" required>
            <option value="">— Sélectionnez votre profil —</option>
            <option value="diaspora">Membre de la Diaspora / Expatrié</option>
            <option value="resident">Résident local</option>
            <option value="professionnel">Professionnel (Géomètre / Notaire)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="country">Pays de résidence</label>
            <input type="text" id="country" placeholder="Ex: France, Canada, Cameroun..." required>
          </div>
          <div class="form-group">
            <label for="phone">Numéro de téléphone</label>
            <div class="phone-container">
              <div class="country-select">
                <button type="button" class="selected-country-btn" id="countryBtn">
                  <img id="selectedFlag" src="https://flagcdn.com/w20/fr.png" width="20" alt="France">
                  <span id="selectedCode">+33</span>
                  <span class="arrow-icon">▼</span>
                </button>
                <div class="country-dropdown" id="countryDropdown">
                  <div class="country-option" data-flag="https://flagcdn.com/w20/fr.png" data-code="+33">
                    <span class="country-info"><img src="https://flagcdn.com/w20/fr.png" width="20" alt="France"> France</span>
                    <span class="code">+33</span>
                  </div>
                  <div class="country-option" data-flag="https://flagcdn.com/w20/cm.png" data-code="+237">
                    <span class="country-info"><img src="https://flagcdn.com/w20/cm.png" width="20" alt="Cameroun"> Cameroun</span>
                    <span class="code">+237</span>
                  </div>
                  <div class="country-option" data-flag="https://flagcdn.com/w20/ci.png" data-code="+225">
                    <span class="country-info"><img src="https://flagcdn.com/w20/ci.png" width="20" alt="Côte d'Ivoire"> Côte d'Ivoire</span>
                    <span class="code">+225</span>
                  </div>
                  <div class="country-option" data-flag="https://flagcdn.com/w20/sn.png" data-code="+221">
                    <span class="country-info"><img src="https://flagcdn.com/w20/sn.png" width="20" alt="Sénégal"> Sénégal</span>
                    <span class="code">+221</span>
                  </div>
                  <div class="country-option" data-flag="https://flagcdn.com/w20/ca.png" data-code="+1">
                    <span class="country-info"><img src="https://flagcdn.com/w20/ca.png" width="20" alt="Canada"> Canada</span>
                    <span class="code">+1</span>
                  </div>
                  <div class="country-option" data-flag="https://flagcdn.com/w20/be.png" data-code="+32">
                    <span class="country-info"><img src="https://flagcdn.com/w20/be.png" width="20" alt="Belgique"> Belgique</span>
                    <span class="code">+32</span>
                  </div>
                  <div class="country-option" data-flag="https://flagcdn.com/w20/ch.png" data-code="+41">
                    <span class="country-info"><img src="https://flagcdn.com/w20/ch.png" width="20" alt="Suisse"> Suisse</span>
                    <span class="code">+41</span>
                  </div>
                  <div class="country-option" data-flag="https://flagcdn.com/w20/ga.png" data-code="+241">
                    <span class="country-info"><img src="https://flagcdn.com/w20/ga.png" width="20" alt="Gabon"> Gabon</span>
                    <span class="code">+241</span>
                  </div>
                  <div class="country-option" data-flag="https://flagcdn.com/w20/us.png" data-code="+1">
                    <span class="country-info"><img src="https://flagcdn.com/w20/us.png" width="20" alt="États-Unis"> États-Unis</span>
                    <span class="code">+1</span>
                  </div>
                </div>
              </div>
              <input type="tel" id="phone" placeholder="6 12 34 56 78" required>
              <input type="hidden" id="countryCodeInput" name="country_code" value="+33">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" placeholder="nom@exemple.com" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="••••••••" required minlength="6">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirmer le mot de passe</label>
            <input type="password" id="confirm-password" placeholder="••••••••" required>
          </div>
        </div>

        <label class="terms-option">
          <input type="checkbox" id="terms" required>
          <span>J'accepte les <a href="#">Conditions Générales d'Utilisation</a> et la politique de protection des données personnelles.</span>
        </label>

        <button type="submit" class="btn-submit">S'inscrire et accéder à mon espace</button>
      </form>

      <div class="login-link">
        Vous avez déjà un compte ? <a href="connexion.html">Se connecter</a>
      </div>
    </div>
  </main>

  <script>
    // Sélecteur de pays
    const countryBtn = document.getElementById('countryBtn');
    const countryDropdown = document.getElementById('countryDropdown');
    const selectedFlag = document.getElementById('selectedFlag');
    const selectedCode = document.getElementById('selectedCode');
    const countryCodeInput = document.getElementById('countryCodeInput');
    const options = document.querySelectorAll('.country-option');

    countryBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      countryDropdown.classList.toggle('show');
    });

    options.forEach(option => {
      option.addEventListener('click', () => {
        selectedFlag.src = option.getAttribute('data-flag');
        selectedCode.textContent = option.getAttribute('data-code');
        countryCodeInput.value = option.getAttribute('data-code');
        countryDropdown.classList.remove('show');
      });
    });

    document.addEventListener('click', () => {
      countryDropdown.classList.remove('show');
    });

    // Soumission du formulaire d'inscription
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const prenom = document.getElementById('prenom').value.trim();
      const nom = document.getElementById('nom').value.trim();
      const type = document.getElementById('profile-type').value;
      const country = document.getElementById('country').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      // Validation simple
      if (password !== confirmPassword) {
        errorMsg.textContent = 'Les mots de passe ne correspondent pas.';
        errorMsg.style.display = 'block';
        successMsg.style.display = 'none';
        return;
      }

      if (!type) {
        errorMsg.textContent = 'Veuillez sélectionner un type de compte.';
        errorMsg.style.display = 'block';
        successMsg.style.display = 'none';
        return;
      }

      // Création de l'utilisateur
      const user = {
        email: email,
        fullName: prenom + ' ' + nom,
        type: type, // 'diaspora' | 'resident' | 'professionnel'
        country: country,
        phone: countryCodeInput.value + ' ' + phone,
        loggedIn: true,
        createdAt: new Date().toISOString()
      };

      // Sauvegarde dans localStorage (simulation de base de données)
      localStorage.setItem('cadastreUser', JSON.stringify(user));

      successMsg.textContent = 'Compte créé avec succès ! Redirection...';
      successMsg.style.display = 'block';
      errorMsg.style.display = 'none';

      // Redirection
      setTimeout(() => {
        const returnUrl = sessionStorage.getItem('returnUrl') || 'mes dossiers.html';
        sessionStorage.removeItem('returnUrl');
        window.location.href = returnUrl;
      }, 900);
    });
  </script>
</body>
</html>
