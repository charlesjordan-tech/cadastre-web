<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Cadastre Diaspora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; }

    header { background: #ffffff; border-bottom: 1px solid #e2e8f0; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
    .logo { font-weight: 700; font-size: 1.15rem; color: #0f172a; text-decoration: none; }
    .logo span { color: #0284c7; }
    nav { display: flex; align-items: center; gap: 1.5rem; }
    nav a { text-decoration: none; color: #475569; font-weight: 500; font-size: 0.9rem; }
    nav a:hover { color: #0284c7; }

    .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
    .login-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; width: 100%; max-width: 440px; padding: 2.5rem 2rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
    
    .login-header { text-align: center; margin-bottom: 2rem; }
    .login-header h1 { font-size: 1.5rem; color: #0f172a; margin-bottom: 0.5rem; }
    .login-header p { font-size: 0.875rem; color: #64748b; }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #334155; }
    .form-group input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: #0284c7; }

    .form-options { display: flex; justify-content: space-between; align-items: center; font-size: 0.825rem; margin-bottom: 1.5rem; }
    .remember-me { display: flex; align-items: center; gap: 0.4rem; color: #475569; }
    .forgot-pwd { color: #0284c7; text-decoration: none; font-weight: 500; }
    .forgot-pwd:hover { text-decoration: underline; }

    .btn-submit { background-color: #0284c7; color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: 600; font-size: 0.95rem; width: 100%; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background-color: #0369a1; }

    .divider { display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: #94a3b8; font-size: 0.8rem; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
    .divider span { padding: 0 0.5rem; }

    .signup-link { text-align: center; font-size: 0.875rem; color: #475569; }
    .signup-link a { color: #ea580c; font-weight: 600; text-decoration: none; }
    .signup-link a:hover { text-decoration: underline; }

    .error-msg { background: #fef2f2; color: #b91c1c; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .success-msg { background: #f0fdf4; color: #15803d; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }

    @media (max-width: 768px) {
      .login-wrapper { padding: 1.5rem 1rem; }
      .login-card { padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">📍 CADASTRE <span>DIASPORA</span></a>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="page assistance.html">Assistance</a>
      </nav>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1>Espace Diaspora</h1>
        <p>Connectez-vous pour suivre vos dossiers fonciers</p>
      </div>

      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" placeholder="nom@exemple.com" required>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe"> Se souvenir de moi
          </label>
          <a href="#" class="forgot-pwd">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn-submit">Se connecter</button>
      </form>

      <div class="divider">
        <span>OU</span>
      </div>

      <div class="signup-link">
        Vous n'avez pas encore de compte ? <br>
        <a href="inscription.html">Créer un compte résident / diaspora / pro</a>
      </div>
    </div>
  </main>

  <script>
    // Vérifie si déjà connecté
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('cadastreUser') || 'null');
      if (user && user.loggedIn) {
        // Déjà connecté → redirige vers mes dossiers
        window.location.href = 'mes dossiers.html';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Simulation simple de connexion
      // Dans une vraie app, on vérifierait contre un backend
      // Ici on accepte n'importe quel email/mot de passe non vide pour la démo
      // et on récupère le profil s'il existe déjà (après inscription)

      let storedUser = JSON.parse(localStorage.getItem('cadastreUser') || 'null');

      // Si l'utilisateur s'est déjà inscrit avec cet email, on le récupère
      if (storedUser && storedUser.email === email) {
        // On considère que le mot de passe est correct pour la démo
        storedUser.loggedIn = true;
        localStorage.setItem('cadastreUser', JSON.stringify(storedUser));
      } else {
        // Première connexion ou compte inexistant → on crée un compte client par défaut
        const newUser = {
          email: email,
          fullName: email.split('@')[0],
          type: 'diaspora', // par défaut
          loggedIn: true,
          createdAt: new Date().toISOString()
        };
        localStorage.setItem('cadastreUser', JSON.stringify(newUser));
        storedUser = newUser;
      }

      // Message de succès
      const successMsg = document.getElementById('successMsg');
      successMsg.textContent = 'Connexion réussie ! Redirection...';
      successMsg.style.display = 'block';

      // Redirection après un court délai
      setTimeout(() => {
        const returnUrl = sessionStorage.getItem('returnUrl') || 'mes dossiers.html';
        sessionStorage.removeItem('returnUrl');
        window.location.href = returnUrl;
      }, 800);
    });
  </script>
</body>
</html>
